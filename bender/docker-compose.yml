services:
    bender_nero:
        image: uchile_robotics/bender_nero
        build:
            context: ./core/
            dockerfile: Dockerfile
        network_mode: host
        container_name: bender_nero
        device_cgroup_rules:
        - 'c 189:* rmw'
        - 'c 81:* rmw'
        # for greater throughput for ros2 control
        cap_add:
        - SYS_NICE
        # CAN (SocketCAN): with network_mode host the container already sees can0; this
        # allows configuring it from inside (ip link set can0 up type can bitrate ...)
        - NET_ADMIN
        ulimits:
            rtprio: 99
            memlock: -1
        devices: # which usb devices (or other types) are allowed to access the container
        - /dev/dri:/dev/dri # odrive and realsense
        volumes:
        - /dev:/dev
        - /dev/bus/usb:/dev/bus/usb
        - /run/udev:/run/udev:ro
        # enables mDNS inside docker
        - /run/avahi-daemon/socket:/run/avahi-daemon/socket
        - /sys:/sys:ro
        - ~/uchile_robotics/bender_bringup:/home/bender_ws/src/bender_bringup
        - ~/uchile_robotics/bender_core:/home/bender_ws/src/bender_core
        - ~/uchile_robotics/uchile_common:/home/bender_ws/src/uchile_common
        - /tmp/.X11-unix:/tmp/.X11-unix
        working_dir: /home/bender_ws
        environment:
        - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        - CYCLONEDDS_URI=file:///cyclonedds.xml
        - DISPLAY=${DISPLAY}
        - QT_X11_NO_MITSHM=1
        stdin_open: true
        tty: true
