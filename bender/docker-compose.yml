services:
    bender_core:
        image: uchile_robotics/bender_core
        build:
            context: ./core/
            dockerfile: Dockerfile
        network_mode: host
        container_name: bender_core
        device_cgroup_rules:
        - 'c 189:* rmw'
        - 'c 81:* rmw' 
        # for greater throughput for ros2 control
        cap_add:
        - SYS_NICE
        ulimits:
            rtprio: 99
            memlock: -1
        devices:
        # - /dev/rplidar:/dev/rplidar
        # - /dev/pioneer:/dev/pioneer
        # - /dev/joy:/dev/joy
        # - /dev/event_joy:/dev/event_joy
        - /dev/dynamixel:/dev/dynamixel
        - /dev/encoders:/dev/encoders
        - /dev/dri:/dev/dri # odrive and realsense
        volumes:
        - /dev/bus/usb:/dev/bus/usb:rslave # odrive
        - /run/udev:/run/udev:ro
        - /dev:/dev:rslave
        - /sys:/sys:ro
        - ~/uchile_robotics/bender_bringup:/home/bender_ws/src/bender_bringup
        - ~/uchile_robotics/bender_core:/home/bender_ws/src/bender_core
        - ~/uchile_robotics/uchile_common:/home/bender_ws/src/uchile_common
        - /tmp/.X11-unix:/tmp/.X11-unix
        working_dir: /home/bender_ws
        environment:
        - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        - CYCLONEDDS_URI=file:///cyclonedds.xml
        - DISPLAY=${DISPLAY}
        - QT_X11_NO_MITSHM=1
        stdin_open: true
        tty: true
